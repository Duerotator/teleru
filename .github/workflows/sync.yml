name: Sync

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: tele-release-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout teleru
        uses: actions/checkout@v7

      - name: Look for a released tele version
        id: upstream
        run: python3 ci/upstream.py update --github-output "$GITHUB_OUTPUT"

      - name: Record the release without replacing translations
        if: steps.upstream.outputs.changed == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TELE_UPSTREAM.json
          git commit -m "chore: track tele release $TAG"
          git push

      - name: Start a build, including a previously failed dispatch
        run: |
          head=$(git rev-parse HEAD)
          found=$(gh run list --workflow build.yml --branch "$GITHUB_REF_NAME" --limit 100 --json headSha --jq ".[] | select(.headSha == \"$head\") | .headSha" | head -n1)
          if [ -z "$found" ]; then
            gh workflow run build.yml --ref "$GITHUB_REF_NAME" -f platforms=windows -f publish=true
          fi

      - name: Report a failed synchronization
        if: failure()
        run: |
          printf 'Could not synchronize tele releases. Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID" > issue.md
          bash ci/issue.sh open tele-sync-failure 'tele release synchronization failed' issue.md

      - name: Close a resolved synchronization failure
        run: bash ci/issue.sh close tele-sync-failure 'tele release synchronization succeeded.'
