name: Canary

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canary

defaults:
  run:
    shell: bash

jobs:
  canary:
    name: Apply the patches to upstream dev
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone tdesktop dev
        id: clone
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 50 --recurse-submodules --shallow-submodules \
            --branch dev https://github.com/telegramdesktop/tdesktop.git ../tdesktop
          sha=$(git -C ../tdesktop rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "upstream dev is at $sha: $(git -C ../tdesktop log -1 --format='%cs %s')"

      - name: Apply patches
        id: apply
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -u tele.py apply 2>&1 | tee apply.log

      - name: Close the conflict issue
        env:
          SHA: ${{ steps.clone.outputs.sha }}
        run: bash ci/issue.sh close canary-conflict "Patches apply cleanly to upstream dev at ${SHA:0:10}."

      - name: Report conflicts
        if: failure() && steps.apply.outcome == 'failure'
        env:
          SHA: ${{ steps.clone.outputs.sha }}
        run: |
          {
            echo "The patches don't apply to upstream dev at [${SHA:0:10}](https://github.com/telegramdesktop/tdesktop/commit/$SHA). The next release will likely need the same fix, so it's cheaper to fix it now."
            echo
            echo '```'
            cat apply.log
            echo '```'
            echo
            echo 'Resolve it locally against dev:'
            echo
            echo '```'
            echo 'git -C ../tdesktop fetch origin dev'
            echo 'git -C ../tdesktop checkout --detach origin/dev'
            echo 'python tele.py apply'
            echo '# fix what it reports, git add, git am --continue, then: python tele.py continue'
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          } > issue.md
          bash ci/issue.sh open canary-conflict "Patches don't apply to upstream dev" issue.md
