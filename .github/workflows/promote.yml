name: Promote

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  promote:
    name: Publish the finished build
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && vars.PROMOTE_RUN != ''
      && format('{0}', github.event.workflow_run.id) == vars.PROMOTE_RUN
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main -f from_run="$RUN" -f publish=true
          echo "publishing the builds of run $RUN from main"
